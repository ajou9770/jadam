    <script>
        window.onload = function() {
          var images = document.querySelectorAll('.giftimg');
          var currentIndex = 0;
    
          setInterval(function() {
            // 현재 이미지 숨기기
            images[currentIndex].style.display = 'none';
    
            // 다음 이미지로 이동
            currentIndex = (currentIndex + 1) % images.length;
    
            // 다음 이미지 보이기
            images[currentIndex].style.display = 'block';
          }, 30000); // 30초 변경 (3600000 밀리초)
        };
      </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh; /* 화면 높이를 보장 */
        overflow: hidden; /* 스크롤바 제거 */
        box-sizing: border-box; /* 패딩 포함 높이 계산 */
      }
  
      /* 부모 컨테이너에 여백 추가 */
      .iframe-container {
        position: relative;
        width: 100%;
        height: 100%; /* 전체 화면 높이 */
        padding-bottom: 20px; /* 바닥 여백 */
      }
  
      /* iframe을 컨테이너에 맞게 설정 */
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100% - 20px); /* 바닥 여백 반영 */
        border: none; /* 테두리 제거 */
        -webkit-overflow-scrolling: touch; /* iOS에서 부드러운 스크롤 활성화 */
        overflow: auto; /* 스크롤 활성화 */
      }
  #loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  align-items: center;

}
#loading-message {

}
#loading-spinner {
  border: 16px solid #f3f3f3;

  border-radius: 50%;
  width: 50px;

  animation: spin 2s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }

  var loadingOverlay = document.getElementById('loading-overlay');

});

<script>
  function seeCal() {
    document.getElementById("cal").style.display="block";
    document.getElementById("hideCal").style.display="block";
    document.getElementById("seecal").style.display="none";
  }
  function hideCal() {
    document.getElementById("cal").style.display="none";
    document.getElementById("seecal").style.display="block";
    document.getElementById("hideCal").style.display="none";
  }
  </script>
  <script>
    // 스크롤 위치를 모니터링하여 버튼을 표시 또는 숨깁니다.
    window.addEventListener('scroll', function() {
      var scrollToTopButton = document.getElementById('scrollToTopButton');
      if (window.pageYOffset > 800) {
        scrollToTopButton.style.display = 'block';
      } else {
        scrollToTopButton.style.display = 'none';
      }
    });
  
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }
  </script>
